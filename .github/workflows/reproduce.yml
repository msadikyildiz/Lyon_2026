name: Reproduce figures and tables
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE*', 'CITATION.cff']
  pull_request:
    paths-ignore: ['**/*.md', 'LICENSE*', 'CITATION.cff']
  workflow_dispatch:
    inputs:
      refit:
        description: Refit dose-response data before rebuilding
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      LYON_PLOT_FONT: STIXGeneral
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - name: Preserve reference outputs
        if: ${{ !inputs.refit }}
        run: git clone --local . reference
      - name: Rebuild figures and tables
        if: ${{ !inputs.refit }}
        run: python reproduce.py
      - name: Compare numerical outputs and image dimensions
        if: ${{ !inputs.refit }}
        run: python scripts/compare_outputs.py reference . --report runs/output-comparison.json
      - name: Refit and rebuild in isolation
        if: ${{ inputs.refit }}
        run: python reproduce.py --refit --jobs 2
      - name: Save validation and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}
          path: |
            runs/**/*.json
            runs/**/*.log
          retention-days: 14
