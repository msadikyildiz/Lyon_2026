name: Reproduce figures and tables
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE*', 'CITATION.cff']
  pull_request:
    paths-ignore: ['**/*.md', 'LICENSE*', 'CITATION.cff']
  workflow_dispatch:
    inputs:
      refit:
        description: Refit dose-response data before rebuilding
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      LYON_PLOT_FONT: STIXGeneral
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          init-shell: none
          cache-environment: true
          cache-environment-key: ${{ hashFiles('requirements-lock.txt') }}
      - name: Preserve reference outputs
        if: ${{ !inputs.refit }}
        run: git clone --local . reference
      - name: Rebuild figures and tables
        if: ${{ !inputs.refit }}
        run: micromamba run -n lyon-2026 python reproduce.py
      - name: Compare numerical outputs and image dimensions
        if: ${{ !inputs.refit }}
        run: micromamba run -n lyon-2026 python scripts/compare_outputs.py reference . --report runs/output-comparison.json
      - name: Refit and rebuild in isolation
        if: ${{ inputs.refit }}
        run: micromamba run -n lyon-2026 python reproduce.py --refit --jobs 2
      - name: Save validation and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}
          path: |
            runs/**/*.json
            runs/**/*.log
            runs/refit-*/working/analysis/stats-rework/cache/*.pkl
            data/genomics/plot_tables/*.csv
            data/genomics/plot_tables/*.json
          retention-days: 14
